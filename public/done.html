<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>送信完了</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="card-page">
    <div id="ok" hidden>
      <h1>見積もり送信完了</h1>
      <p>LINEトークを確認してください。</p>
      <a class="btn-line" id="line-open" href="line://">LINEを開く</a>
      <a class="btn-secondary" id="line-chat" href="line://">現地調査の希望日を送る</a>
      <p class="note">※ 詳細な見積もりには現地調査が必要です。<br>トークに希望日時を返信してください。</p>
    </div>

    <div id="cancelled" hidden>
      <h1>キャンセルされました</h1>
      <p>もう一度お試しください。</p>
      <a class="btn-line" href="index.html">入力画面に戻る</a>
    </div>

    <div id="invalid" hidden>
      <h1>入力エラー</h1>
      <p>入力内容を確認してください。</p>
      <a class="btn-line" href="index.html">入力画面に戻る</a>
    </div>

    <div id="error" hidden>
      <h1>エラーが発生</h1>
      <p>時間をおいて再度お試しください。</p>
      <a class="btn-line" href="index.html">入力画面に戻る</a>
    </div>
  </main>

  <script src="config.js"></script>
  <script>
    (() => {
      const status = new URLSearchParams(location.search).get('status') || 'ok';
      const target = document.getElementById(status) || document.getElementById('error');
      target.hidden = false;
      const oaUrl = (window.APP_CONFIG && window.APP_CONFIG.LINE_OA_URL) || 'line://';
      const a = document.getElementById('line-chat');
      const b = document.getElementById('line-open');
      if (a) a.href = oaUrl;
      if (b) b.href = oaUrl;
    })();
  </script>
</body>
</html>
